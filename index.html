<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Rhythm - 極簡節奏</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrapper">
    <aside class="sidebar">
      <h2>MINIMAL<br>RHYTHM</h2>
      <div class="score-board">
        <div class="stat-item">
          <span>SCORE</span>
          <h3 id="score">0</h3>
        </div>
        <div class="stat-item">
          <span>COMBO</span>
          <h3 id="combo">0</h3>
        </div>
        <div class="stat-item">
          <span>JUDGMENT</span>
          <h3 id="judgment" class="jud-normal">-</h3>
        </div>
      </div>

      <div class="controls-panel">
        <label for="audio-upload" class="upload-btn">📁 上傳自選音樂 (MP3)</label>
        <input type="file" id="audio-upload" accept="audio/*">
        
        <!-- 新增音量控制滑桿 -->
        <div class="volume-control">
          <span>音量調整</span>
          <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" oninput="setVolume(this.value)">
        </div>

        <button id="start-btn" class="action-btn">▶ 開始遊戲</button>
      </div>

      <div class="key-hints">
        <p>鍵位對應：</p>
        <code>[ D ] [ F ] [ J ] [ K ]</code>
      </div>
    </aside>

    <main class="canvas-container">
      <canvas id="gameCanvas" width="400" height="600"></canvas>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
